# simply-api — shared infrastructure crates for the simply projects (flux,
# tussen, sense). The repo is named after its main crate.
[workspace]
resolver = "2"
members = [
    "crates/simply-api",
    "crates/simply-api-macros",
    "crates/simply-history",
    "crates/simply-offscreen",
    "crates/simply-op-macros",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/poucet/simply-api"
authors = ["Christophe Poucet"]

[workspace.dependencies]
# The repo's own crates, declared once; members depend on siblings with
# `<crate>.workspace = true`. A consumer depends on them by git tag instead.
simply-api = { path = "crates/simply-api" }
simply-api-macros = { path = "crates/simply-api-macros" }
simply-history = { path = "crates/simply-history" }
simply-offscreen = { path = "crates/simply-offscreen" }
simply-op-macros = { path = "crates/simply-op-macros" }

# Same requirements as flux's workspace at bae34fcf.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
