[package]
name = "simply-hooks"
description = "Signed outbound webhooks: an app emits an event, a background worker delivers it to each target with retries from a small persistent outbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Deliberately independent of `simply-api`, like `simply-relay`: any app can
# compile it in. Every dependency was already in this workspace's lockfile;
# the HTTP client is a single POST over tokio and rustls (src/http.rs), so no
# HTTP crate is pulled in.
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
http = "1"
httparse = "1"
ring = "0.17"
# rustls with ring and webpki roots, as simply-relay builds it: no
# process-wide crypto provider has to be installed by the app.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# `log`: with no tracing subscriber installed the events reach the `log`
# crate, so an app on env_logger sees them too.
tracing = { version = "0.1", features = ["log"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"

# A linked device's key in the macOS keychain (src/keys.rs). Off by
# default; off macOS the keychain keeps nothing and says so.
[features]
keychain = ["dep:security-framework"]

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
