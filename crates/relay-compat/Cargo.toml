[package]
name = "relay-compat"
description = "Dev-only: proves Lumina's rmcp 1.3 client and an app's rmcp 3.x server talk over the relay's WebSocket"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Nothing but tests. It exists so rmcp 1.3 (Lumina's) and rmcp 3.x (the
# apps') can meet in one test binary without either reaching a published
# crate.
[dependencies]

[dev-dependencies]
async-trait = "0.1"
futures = "0.3"
rmcp13 = { package = "rmcp", version = "=1.3.0", default-features = false, features = ["client"] }
rmcp = { version = "3.1.4", default-features = false, features = ["server"] }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
simply-api.workspace = true
simply-relay.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
